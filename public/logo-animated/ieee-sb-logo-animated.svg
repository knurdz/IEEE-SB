<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048" role="img" aria-label="IEEE SB animated logo" shape-rendering="geometricPrecision">
  <title>IEEE SB animated logo</title>
  <rect width="100%" height="100%" fill="none" />
  <g class="moving-layer moving-layer-1">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 1024.0 1024.0" to="360 1024.0 1024.0" dur="120.00s" repeatCount="indefinite" />
    <image href="ieee-sb-logo-animated-layer-01.png" x="0" y="0" width="2048" height="2048" preserveAspectRatio="none" />
  </g>
  <image href="ieee-sb-logo-animated-center.png" x="0" y="0" width="2048" height="2048" preserveAspectRatio="none" />
</svg>